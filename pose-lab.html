<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose lab</title>
<style>
  :root { --bg: #15171c; --panel: #1e2128; --line: #343945; --fg: #e6e8ee; --dim: #9aa1b2; --acc: #ffb454; --ok: #7bd88f; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.35 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
  #stage { position: relative; min-width: 0; min-height: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
  #panel { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px 40px; }
  h2 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  label { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; margin: 4px 0; }
  select, input[type=number], button { font: inherit; color: var(--fg); background: #2a2e38; border: 1px solid var(--line); border-radius: 6px; min-height: 40px; padding: 4px 8px; }
  button { cursor: pointer; }
  button.on, .views button.on { background: var(--acc); color: #111; border-color: var(--acc); }
  input[type=range] { width: 100%; min-height: 40px; accent-color: var(--acc); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .bar { background: rgba(21, 23, 28, .88); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 2px 4px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; }
  .pass { color: var(--ok); } .fail { color: var(--bad); }
  .param { display: grid; grid-template-columns: 1fr 64px; gap: 4px 8px; margin: 6px 0; }
  .param b { grid-column: 1 / -1; font-weight: 600; font-size: 12px; color: var(--dim); }
  .param.changed b { color: var(--acc); }
  #grid td { padding: 2px; text-align: center; }
  #grid td:first-child { text-align: left; font-size: 12px; color: var(--dim); white-space: nowrap; }
  button.cell { width: 100%; min-width: 44px; min-height: 40px; padding: 2px; font-variant-numeric: tabular-nums; }
  button.cell.pass { background: #23452c; border-color: var(--ok); }
  button.cell.fail { background: #4a2626; border-color: var(--bad); }
  button.cell.na { background: #2f323a; border-color: #4a4f5c; color: var(--dim); }
  button.cell.worst { outline: 3px solid var(--acc); }
  #mxsum { margin: 6px 0; font-size: 12px; color: var(--dim); }
  textarea { font: inherit; color: var(--fg); background: #2a2e38; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #status { color: var(--dim); font-size: 12px; min-height: 16px; }
  #status.err { color: var(--bad); }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh minmax(0, 1fr); }
    #panel { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
<div id="panel"></div>
<script type="module" src="/src/dev/pose-lab/lab.js"></script>
</body>
</html>
