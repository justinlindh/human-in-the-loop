<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human in the Loop</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d6; }
      #app { position: fixed; inset: 0; touch-action: pan-x pan-y; }
      #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; isolation: isolate; z-index: 1; }
      #ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
