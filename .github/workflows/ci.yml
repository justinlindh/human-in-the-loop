name: ci

# Runs on pushes to the default branches and on every pull request. A PR merges on `smoke`, `commits` and
# the reviewer's `review` status (see CLAUDE.md); `test` runs on pushes to main and manual runs, and the
# other heavy jobs on a manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR's newer push cancels its older run, so superseded heads don't hold runners. Pushes to main and
# manual runs each get their own group (the run id) and are never grouped or cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full test suite: on pushes to main and manual runs, not on pull requests (they pass `smoke`).
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change (scripts/ci-skip-paths, read from the base branch)
        id: cls
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [ "$EVENT" = pull_request ]; then
            git fetch -q origin "$BASE_REF"
            if git show "origin/$BASE_REF:scripts/ci-classify.sh" >"$RUNNER_TEMP/classify.sh" 2>/dev/null \
              && git show "origin/$BASE_REF:scripts/ci-skip-paths" >"$RUNNER_TEMP/skip" 2>/dev/null; then
              git show "origin/$BASE_REF:scripts/ci-tests-only-paths" >"$RUNNER_TEMP/tests-only" 2>/dev/null || : >"$RUNNER_TEMP/tests-only"
              mode="$(git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" | bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/skip" "$RUNNER_TEMP/tests-only")"
            fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          if [ "$mode" = light ]; then echo "skipped: docs-only change" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$mode" = tests ]; then echo "tests tier: only tests read this change (scripts/ci-tests-only-paths)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: No node_modules in the repo
        run: test -z "$(git ls-files node_modules)"
      - name: Syntax of touched .js and .mjs (light gate)
        if: steps.cls.outputs.mode != 'full'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" | grep -E '\.m?js$' | while read -r f; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - uses: actions/setup-node@v7
        if: steps.cls.outputs.mode != 'light'
        with:
          node-version: 25
          cache: npm
      - run: npm ci
        if: steps.cls.outputs.mode != 'light'
      # Every script parses, including ones no test imports (local CI's syntax step, which PR runs leave to this job).
      - name: Syntax of every .js and .mjs
        if: steps.cls.outputs.mode == 'full'
        run: |
          failed=0
          while IFS= read -r f; do node --check "$f" || failed=1; done < <(git ls-files 'src/**.js' 'src/**.mjs' 'scripts/**.js' 'scripts/**.mjs' 'blender/**.mjs')
          exit $failed
      - run: npm run test:fast
        if: steps.cls.outputs.mode != 'light'
      - run: npm run build
        if: steps.cls.outputs.mode == 'full'

  # The gate a PR passes (scripts/smoke.sh: syntax, the tests that import the change, the features and
  # toolkit checks, a build). The jobs below are the rest of the suite; they run on a manual dispatch of
  # this workflow, and a release runs the whole suite itself (scripts/release.sh).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - name: Smoke checks
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: bash scripts/smoke.sh --base "origin/$BASE"

  balance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change (scripts/ci-skip-paths, read from the base branch)
        id: cls
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [ "$EVENT" = pull_request ]; then
            git fetch -q origin "$BASE_REF"
            if git show "origin/$BASE_REF:scripts/ci-classify.sh" >"$RUNNER_TEMP/classify.sh" 2>/dev/null \
              && git show "origin/$BASE_REF:scripts/ci-skip-paths" >"$RUNNER_TEMP/skip" 2>/dev/null; then
              git show "origin/$BASE_REF:scripts/ci-tests-only-paths" >"$RUNNER_TEMP/tests-only" 2>/dev/null || : >"$RUNNER_TEMP/tests-only"
              mode="$(git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" | bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/skip" "$RUNNER_TEMP/tests-only")"
            fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          if [ "$mode" = light ]; then echo "skipped: docs-only change" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$mode" = tests ]; then echo "tests tier: only tests read this change (scripts/ci-tests-only-paths)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Does the change touch balance? (scripts/ci-balance-skip-paths, read from the base branch)
        id: bal
        if: steps.cls.outputs.mode == 'full'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [ "$EVENT" = pull_request ]; then
            if git show "origin/$BASE_REF:scripts/ci-classify.sh" >"$RUNNER_TEMP/classify.sh" 2>/dev/null \
              && git show "origin/$BASE_REF:scripts/ci-balance-skip-paths" >"$RUNNER_TEMP/bal-skip" 2>/dev/null; then
              mode="$(git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" | bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/bal-skip")"
            fi
          fi
          echo "run=$([ "$mode" = light ] && echo false || echo true)" >>"$GITHUB_OUTPUT"
          if [ "$mode" = light ]; then echo "skipped: no sim changes" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v7
        if: steps.cls.outputs.mode == 'full' && steps.bal.outputs.run == 'true'
        with:
          node-version: 25
          cache: npm
      - run: npm ci
        if: steps.cls.outputs.mode == 'full' && steps.bal.outputs.run == 'true'
      - run: npm run test:balance
        if: steps.cls.outputs.mode == 'full' && steps.bal.outputs.run == 'true'

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The runners have no GPU; local runs default to it (scripts/lib/gl.js).
    env:
      HITL_GL: software
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change (scripts/ci-skip-paths, read from the base branch)
        id: cls
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [ "$EVENT" = pull_request ]; then
            git fetch -q origin "$BASE_REF"
            if git show "origin/$BASE_REF:scripts/ci-classify.sh" >"$RUNNER_TEMP/classify.sh" 2>/dev/null \
              && git show "origin/$BASE_REF:scripts/ci-skip-paths" >"$RUNNER_TEMP/skip" 2>/dev/null; then
              git show "origin/$BASE_REF:scripts/ci-tests-only-paths" >"$RUNNER_TEMP/tests-only" 2>/dev/null || : >"$RUNNER_TEMP/tests-only"
              mode="$(git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" | bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/skip" "$RUNNER_TEMP/tests-only")"
            fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          if [ "$mode" = light ]; then echo "skipped: docs-only change" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$mode" = tests ]; then echo "tests tier: only tests read this change (scripts/ci-tests-only-paths)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v7
        if: steps.cls.outputs.mode == 'full'
        with:
          node-version: 25
          cache: npm
      - run: npm ci
        if: steps.cls.outputs.mode == 'full'
      - run: npx playwright install --with-deps chromium
        if: steps.cls.outputs.mode == 'full'
      - run: npm run soak
        if: steps.cls.outputs.mode == 'full'
      - run: npm run lifecycle -- --quality low --no-shots
        if: steps.cls.outputs.mode == 'full'

  # Checks that need nothing from the local machine, moved out of local CI: the main guard's own cases,
  # and the renderer's counts against scripts/perf/budget.json (counts, never timings, on software GL).
  tools:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HITL_GL: software
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change (scripts/ci-skip-paths, read from the base branch)
        id: cls
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=full
          if [ "$EVENT" = pull_request ]; then
            git fetch -q origin "$BASE_REF"
            if git show "origin/$BASE_REF:scripts/ci-classify.sh" >"$RUNNER_TEMP/classify.sh" 2>/dev/null \
              && git show "origin/$BASE_REF:scripts/ci-skip-paths" >"$RUNNER_TEMP/skip" 2>/dev/null; then
              git show "origin/$BASE_REF:scripts/ci-tests-only-paths" >"$RUNNER_TEMP/tests-only" 2>/dev/null || : >"$RUNNER_TEMP/tests-only"
              mode="$(git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" | bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/skip" "$RUNNER_TEMP/tests-only")"
            fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          if [ "$mode" = light ]; then echo "skipped: docs-only change" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$mode" = tests ]; then echo "tests tier: only tests read this change (scripts/ci-tests-only-paths)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Which of these checks does the change need? (scripts/ci-guard-skip-paths and scripts/ci-perf-skip-paths, read from the base branch)
        id: need
        if: steps.cls.outputs.mode == 'full'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          guard=true; perf=true
          if [ "$EVENT" = pull_request ] && git show "origin/$BASE_REF:scripts/ci-classify.sh" >"$RUNNER_TEMP/classify.sh" 2>/dev/null; then
            git diff --name-only --no-renames "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA" >"$RUNNER_TEMP/changed"
            if git show "origin/$BASE_REF:scripts/ci-guard-skip-paths" >"$RUNNER_TEMP/guard-skip" 2>/dev/null \
              && [ "$(bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/guard-skip" <"$RUNNER_TEMP/changed")" = light ]; then guard=false; fi
            if git show "origin/$BASE_REF:scripts/ci-perf-skip-paths" >"$RUNNER_TEMP/perf-skip" 2>/dev/null \
              && [ "$(bash "$RUNNER_TEMP/classify.sh" "$RUNNER_TEMP/perf-skip" <"$RUNNER_TEMP/changed")" = light ]; then perf=false; fi
          fi
          echo "guard=$guard" >>"$GITHUB_OUTPUT"; echo "perf=$perf" >>"$GITHUB_OUTPUT"
          [ "$guard" = true ] || echo "skipped: the main guard's cases (no tooling change)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$perf" = true ] || echo "skipped: the renderer counts (nothing that can move them changed)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        if: steps.cls.outputs.mode == 'full' && (steps.need.outputs.guard == 'true' || steps.need.outputs.perf == 'true')
        with:
          node-version: 25
          cache: npm
      - run: npm ci
        if: steps.cls.outputs.mode == 'full' && (steps.need.outputs.guard == 'true' || steps.need.outputs.perf == 'true')
      - name: The main guard's cases
        if: steps.cls.outputs.mode == 'full' && steps.need.outputs.guard == 'true'
        run: bash scripts/main-guard.test.sh
      - run: npx playwright install --with-deps chromium
        if: steps.cls.outputs.mode == 'full' && steps.need.outputs.perf == 'true'
      - name: Renderer counts against the budget
        if: steps.cls.outputs.mode == 'full' && steps.need.outputs.perf == 'true'
        run: |
          node scripts/perf/bench.js --scenes garage,floor,hq,music,floor-eras,floor-dotcom,floor-web2,hq-eras,hq-dotcom,hq-web2 --quality low,high --runs 1 --warmup 2 --seconds 1 --json "$RUNNER_TEMP/perf-counts.json"
          node scripts/perf/budget.js "$RUNNER_TEMP/perf-counts.json" --counts-only

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits (PR title and commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh "$BASE" "$HEAD" "$TITLE"
