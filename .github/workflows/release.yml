name: release

# semantic-release reads the Conventional Commits since the last tag, tags the next version, and
# publishes a GitHub release; a new release then deploys to Pages. Release rules: .releaserc.json.
# A release is made only for a main commit whose `ci` run passed: this workflow starts when that run
# completes and does nothing unless it succeeded, so a merge that breaks main never deploys. A red main
# is reported by main-red.yml.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only compute and print the next version
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Only a push to main whose ci run succeeded (a pull request run of ci has the pull request's branch
    # name, which could be "main" on a fork); a manual run is always allowed.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The commit whose ci run passed, not the branch tip: the Pages job below builds the tag made from
      # it. A queued run that main has moved past releases nothing (semantic-release sees the branch
      # ahead), and the newest run releases.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: before
        run: echo "tags=$(git tag --points-at HEAD --list 'v*' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
      # A release made with GITHUB_TOKEN triggers no other workflow, so Pages is called from here.
      - id: tag
        env:
          BEFORE: ${{ steps.before.outputs.tags }}
        run: |
          for t in $(git tag --points-at HEAD --list 'v*'); do
            case " $BEFORE " in *" $t "*) ;; *) echo "tag=$t" >> "$GITHUB_OUTPUT" ;; esac
          done

  pages:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
